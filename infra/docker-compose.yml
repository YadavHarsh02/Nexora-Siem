services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ../frontend/nexora:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
