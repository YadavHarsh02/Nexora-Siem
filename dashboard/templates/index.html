<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Mini SIEM Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            padding:20px;
        }

        h1{
            margin-bottom:25px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .status{
            color:#4ade80;
            font-weight:bold;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#111827;
            padding:20px;
            border-radius:12px;
            border:1px solid #1e293b;
            text-align:center;
        }

        .card h2{
            color:#38bdf8;
            margin-bottom:10px;
            font-size:20px;
        }

        .card p{
            font-size:28px;
            font-weight:bold;
        }

        .charts{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
            margin-bottom:30px;
        }

        .chart-box{
            background:#111827;
            padding:20px;
            border-radius:12px;
            border:1px solid #1e293b;
        }

        .chart-title{
            margin-bottom:15px;
            color:#38bdf8;
            font-size:18px;
        }

        .search-box{
            background:#111827;
            padding:20px;
            border-radius:12px;
            margin-bottom:30px;
            border:1px solid #1e293b;
        }

        .search-box h2{
            margin-bottom:15px;
            color:#38bdf8;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            margin-bottom:15px;
            background:#1e293b;
            color:white;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#1d4ed8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#111827;
            border-radius:12px;
            overflow:hidden;
        }

        th{
            background:#1e293b;
            padding:14px;
            text-align:left;
            color:#38bdf8;
        }

        td{
            padding:12px;
            border-bottom:1px solid #1e293b;
        }

        tr:hover{
            background:#172033;
        }

        .section-title{
            margin-bottom:15px;
            font-size:22px;
        }

        .high{
            color:#ef4444;
            font-weight:bold;
        }

        .medium{
            color:#facc15;
            font-weight:bold;
        }

        .low{
            color:#4ade80;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="topbar">

        <h1>Mini SIEM Dashboard</h1>

        <div class="status">
            SOC STATUS: ACTIVE
        </div>

    </div>

    <!-- STATS -->

    <div class="cards">

        <div class="card">
            <h2>Total Alerts</h2>
            <p id="totalAlerts">0</p>
        </div>

        <div class="card">
            <h2>High Severity</h2>
            <p id="highAlerts">0</p>
        </div>

        <div class="card">
            <h2>Medium Severity</h2>
            <p id="mediumAlerts">0</p>
        </div>

        <div class="card">
            <h2>SOC Health</h2>
            <p>Healthy</p>
        </div>

    </div>

    <!-- CHARTS -->

    <div class="charts">

        <div class="chart-box">

            <div class="chart-title">
                Severity Distribution
            </div>

            <canvas id="severityChart"></canvas>

        </div>

        <div class="chart-box">

            <div class="chart-title">
                Alert Type Distribution
            </div>

            <canvas id="typeChart"></canvas>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <h2>Threat Hunt Search</h2>

        <input
            type="text"
            id="huntInput"
            placeholder="Search username, IP, severity, alert type..."
        />

        <button onclick="huntSearch()">
            Search
        </button>

    </div>

    <!-- RESULTS -->

    <h2 class="section-title">Recent Alerts</h2>

    <table>

        <thead>

            <tr>
                <th>Timestamp</th>
                <th>Alert Type</th>
                <th>Severity</th>
                <th>IP</th>
                <th>User</th>
            </tr>

        </thead>

        <tbody id="alertsTable">

        </tbody>

    </table>

    <script>

        let severityChart;
        let typeChart;

        async function loadDashboard() {

            const response = await fetch(
                "http://127.0.0.1:8000/alerts/recent"
            );

            const data = await response.json();

            const alerts = data.alerts || [];

            document.getElementById(
                "totalAlerts"
            ).innerText = alerts.length;

            let high = 0;
            let medium = 0;
            let low = 0;

            const typeCounts = {};

            const table = document.getElementById(
                "alertsTable"
            );

            table.innerHTML = "";

            alerts.forEach(alert => {

                const severity =
                    (alert.severity || "").toUpperCase();

                if(severity === "HIGH"){
                    high++;
                }
                else if(severity === "MEDIUM"){
                    medium++;
                }
                else{
                    low++;
                }

                const type =
                    alert.alert_type || "unknown";

                typeCounts[type] =
                    (typeCounts[type] || 0) + 1;

                const row = `
                    <tr>
                        <td>${alert.timestamp || "-"}</td>
                        <td>${type}</td>
                        <td class="${severity.toLowerCase()}">
                            ${severity}
                        </td>
                        <td>${alert.source_ip || "-"}</td>
                        <td>${alert.username || "-"}</td>
                    </tr>
                `;

                table.innerHTML += row;

            });

            document.getElementById(
                "highAlerts"
            ).innerText = high;

            document.getElementById(
                "mediumAlerts"
            ).innerText = medium;

            // =========================
            // SEVERITY CHART
            // =========================

            if(severityChart){
                severityChart.destroy();
            }

            severityChart = new Chart(
                document.getElementById("severityChart"),
                {
                    type: "doughnut",

                    data: {

                        labels: [
                            "HIGH",
                            "MEDIUM",
                            "LOW"
                        ],

                        datasets: [{
                            data: [
                                high,
                                medium,
                                low
                            ]
                        }]
                    }
                }
            );

            // =========================
            // ALERT TYPE CHART
            // =========================

            if(typeChart){
                typeChart.destroy();
            }

            typeChart = new Chart(
                document.getElementById("typeChart"),
                {
                    type: "bar",

                    data: {

                        labels: Object.keys(typeCounts),

                        datasets: [{
                            label: "Alerts",
                            data: Object.values(typeCounts)
                        }]
                    }
                }
            );

        }

        // =========================
        // THREAT HUNT SEARCH
        // =========================

        async function huntSearch(){

            const query = document.getElementById(
                "huntInput"
            ).value;

            if(!query){
                return;
            }

            const response = await fetch(
                `http://127.0.0.1:8000/hunt/query?q=${query}`
            );

            const data = await response.json();

            const table = document.getElementById(
                "alertsTable"
            );

            table.innerHTML = "";

            const results = data.results || [];

            results.forEach(alert => {

                const severity =
                    (alert.severity || "").toUpperCase();

                const row = `
                    <tr>
                        <td>${alert.timestamp || "-"}</td>
                        <td>${alert.alert_type || "-"}</td>
                        <td class="${severity.toLowerCase()}">
                            ${severity}
                        </td>
                        <td>${alert.source_ip || "-"}</td>
                        <td>${alert.username || "-"}</td>
                    </tr>
                `;

                table.innerHTML += row;

            });

        }

        loadDashboard();

        setInterval(
            loadDashboard,
            10000
        );

    </script>

</body>

</html>
