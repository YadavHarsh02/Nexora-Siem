[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-siem"
version = "1.0.0"
description = "AI-assisted SIEM platform for defensive security"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["siem*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
